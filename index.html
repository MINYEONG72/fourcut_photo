<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>크리스마스 인생네컷</title><link rel="stylesheet" href="style.css"></head><body><main><h1>🎄 크리스마스 인생네컷</h1><p class="sub">프레임 선택 → 8장 촬영 → 4장 선택 → 완성!</p><section id="step1"><h2>① 프레임 선택</h2><div id="frames" class="frame-grid"></div><button id="start" disabled>카메라 시작</button></section><section id="step2" hidden><h2>② 사진 8장 촬영</h2><p>카메라 접근을 허용해주세요. 촬영할 때마다 3초 카운트다운이 진행됩니다.</p><div class="camera"><video id="video" autoplay playsinline muted></video><div id="countdown"></div></div><p id="progress">0 / 8장</p><button id="shoot">8장 연속 촬영</button><button class="secondary" id="cancel">처음으로</button></section><section id="step3" hidden><h2>③ 마음에 드는 사진 4장 선택</h2><p id="selectedCount">0 / 4장 선택</p><div id="shots" class="shot-grid"></div><button id="make" disabled>인생네컷 만들기</button><button class="secondary" id="retake">다시 촬영</button></section><section id="step4" hidden><h2>④ 완성된 인생네컷 🎁</h2><canvas id="result" width="1240" height="1748"></canvas><div class="actions"><button id="download">PNG 사진 저장</button><button id="share">사진 공유 / 이메일 앱</button><button class="secondary" id="again">새로 만들기</button></div><p class="note">이메일 앱의 사진 첨부 기능을 사용하세요. 지원되는 기기에서는 공유 버튼으로 완성된 PNG 파일을 직접 전달할 수 있습니다.</p></section><p id="message" role="status"></p></main><script src="app.js"></script></body></html>
